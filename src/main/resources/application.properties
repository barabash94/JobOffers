# APPLICATION
spring.application.name=JobOffers


# MONGODB
spring.mongodb.uri=mongodb://admin:admin@localhost:27017/offers
spring.data.mongodb.auto-index-creation=true


# HTTP CLIENT
offer.http.client.config.connectionTimeout=1000
offer.http.client.config.readTimeout=1000
offer.http.client.config.uri=https://fake-java-offers-api.onrender.com
offer.http.client.config.port=443


# SCHEDULER
http.offers.scheduler.request.delay=PT3H
scheduling.enabled=true


# JWT AUTHENTICATION
auth.jwt.secret=your-very-long-secret-key-for-development
auth.jwt.expiration-days=7
auth.jwt.issuer=job-offers


# REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:63792}
spring.cache.type=redis
spring.cache.redis.time-to-live=PT60M