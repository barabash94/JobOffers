plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bara'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation("org.junit.jupiter:junit-jupiter-api:6.1.3")
	testImplementation("org.assertj:assertj-core:4.0.0-M1")
	implementation("org.projectlombok:lombok:1.18.48")
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
	testImplementation 'org.testcontainers:mongodb:1.21.3'
	implementation("org.springframework.data:spring-data-commons:4.2.0-M2")
	testImplementation 'org.springframework.boot:spring-boot-starter-jackson'
	testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	testImplementation("org.awaitility:awaitility:4.3.0")
	testImplementation("org.mockito:mockito-core:5.24.0")
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation("org.springframework.boot:spring-boot-validation:4.2.0-RC2")
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.auth0:java-jwt:4.5.0'


}

tasks.named('test') {
	useJUnitPlatform()
}
sourceSets {
	integration {
		java {
			srcDirs = ['src/integration/java']
		}
		resources {
			srcDirs = ['src/integration/resources']
		}

		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}


configurations {
	integrationImplementation.extendsFrom testImplementation
	integrationRuntimeOnly.extendsFrom testRuntimeOnly

}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests'
	group = 'verification'

	testClassesDirs = sourceSets.integration.output.classesDirs
	classpath = sourceSets.integration.runtimeClasspath

	useJUnitPlatform()

	shouldRunAfter tasks.named('test')
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest')
}
